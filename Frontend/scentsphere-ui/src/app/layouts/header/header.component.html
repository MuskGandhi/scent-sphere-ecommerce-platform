<header class="navbar">
  <div class="logo">
    <a routerLink="/products"> ScentSphere </a>
  </div>

  <nav class="nav-menu">
    <a *ngIf="authService.isAdmin()" routerLink="/admin/products"> Admin </a>
    <a routerLink="/products"> Products </a>

    <a routerLink="/cart"> Cart </a>

    <a routerLink="/orders"> Orders </a>
  </nav>

  <div *ngIf="!isLoggedIn()" class="auth-links">
    <a routerLink="/login"> Login </a>

    <a routerLink="/register" class="register-btn"> Register </a>
  </div>

  <div *ngIf="isLoggedIn()" class="user-section">
    <a routerLink="/cart" class="cart-icon"> 🛒 </a>

    <div class="profile-circle" (click)="showDropdown = !showDropdown">
      {{ getUserName().charAt(0).toUpperCase() }}
    </div>

    <div class="profile-dropdown" *ngIf="showDropdown">
      <div class="user-email">
        {{ getUserName() }}
      </div>

      <hr />

      <button class="logout-btn" (click)="logout()">Logout</button>
    </div>
  </div>
</header>
